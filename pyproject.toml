[project]
name = "neo4j-manager"
version = "0.1.0"
description = "Manage local Colima/Docker Neo4j instances, with cross-machine data sync via git."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "tomli-w>=1.0",
    "textual>=8.2.8",
    "pyperclip>=1.8.2",
]

[project.scripts]
neo4j-manager = "neo4j_manager.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neo4j_manager"]
artifacts = ["*.tcss"]
